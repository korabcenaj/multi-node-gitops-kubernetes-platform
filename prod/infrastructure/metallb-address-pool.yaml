apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-services
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 192.168.1.200/32
    - 192.168.1.206/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-services
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-services
