# Longhorn Critical Always-On StorageClass
# 
# ⚠️  CRITICAL: This StorageClass is for always-on database workloads ONLY.
# Replicas are placed on nodes tagged "always-on" (control1, control2).
# worker and control3 MUST NOT host replicas for volumes using this class.
#
# Prerequisites (apply manually):
#   kubectl -n longhorn-system patch node.longhorn.io control1 --type='merge' \
#     -p '{"spec":{"tags":["always-on","critical"]}}'
#   kubectl -n longhorn-system patch node.longhorn.io control2 --type='merge' \
#     -p '{"spec":{"tags":["always-on","critical"]}}'
#
# Number of replicas: 2 (only 2 always-on nodes exist).
#
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-critical-2replica
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "false"
  dataEngine: v1
  backupTargetName: default
  # Node selector: only schedule replicas on nodes tagged "always-on"
  nodeSelector: "always-on"
