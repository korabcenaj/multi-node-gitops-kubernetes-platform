# GoKubeDownscaler — Flux HelmRelease
#
# PURPOSE
#   Scale optional workloads to 0 during off-hours (22:00–07:00 Europe/Berlin)
#   to save power. Core infrastructure namespaces are excluded and never touched.
#
# SCHEDULING STRATEGY
#   - The global DEFAULT_UPTIME covers 24 h (controller is permissive by default).
#   - Downscaling is opted-in per-namespace via the annotation:
#       downscaler/uptime: "Mon-Sun 07:00-22:00 Europe/Berlin"
#   - The controller restores original replica counts automatically at uptime start.
#
# FLUX CONFLICT GUARD
#   Flux reconciles HelmRelease values every `interval`. Since optional-app
#   HelmReleases do not hard-code `spec.replicas`, Flux won't fight the downscaler.
#   If a chart does set replicas in values, GoKubeDownscaler wins: it re-patches
#   the live resource on every scan (default: 60 s), which is faster than Flux's
#   1 h reconcile loop.
#
apiVersion: v1
kind: Namespace
metadata:
  name: kube-downscaler
  labels:
    app.kubernetes.io/part-of: kube-downscaler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: go-kube-downscaler
  namespace: kube-downscaler
spec:
  releaseName: go-kube-downscaler
  chart:
    spec:
      chart: go-kube-downscaler
      version: ">=1.3.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: caas-team
        namespace: flux-system
  interval: 1h
  timeout: 5m
  values:
    # ── Global scheduling ────────────────────────────────────────────────────
    # Permissive global default — individual namespaces opt-in to downscaling
    # via the `downscaler/uptime` annotation set on each namespace manifest.
    arguments:
      - --default-uptime=Mon-Sun 00:00-24:00 Europe/Berlin
      - --interval=60

    # ── Namespace exclusions ─────────────────────────────────────────────────
    # These namespaces are NEVER touched by the downscaler, regardless of
    # annotations. This is the definitive "always-on" safeguard.
    excludeNamespaces:
      - kube-system
      - flux-system
      - cert-manager
      - metallb-system
      - traefik
      - velero
      - longhorn-system
      - kube-downscaler
      # Always-on app namespaces — core infrastructure
      - git
      - ldap
      - oauth2-proxy
      - dns
      - vpn

    # ── Resource limits ──────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # ── RBAC ─────────────────────────────────────────────────────────────────
    # The chart creates a ClusterRole + ClusterRoleBinding by default.
    rbac:
      create: true
