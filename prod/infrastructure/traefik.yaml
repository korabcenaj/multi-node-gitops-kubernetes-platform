# Traefik — Flux HelmRelease (migrated from Terraform)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: 40.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 1h
  timeout: 15m
  values:
    providers:
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: true
    gateway:
      enabled: false
    deployment:
      replicas: 1
    service:
      type: LoadBalancer
      spec:
        loadBalancerIP: "192.168.1.206"
        externalTrafficPolicy: Local
    ports:
      web:
        proxyProtocol:
          trustedIPs:
            - 100.0.0.0/8
            - 10.0.0.0/8
            - 192.168.1.0/24
        http:
          middlewares:
            - traefik-ip-allowlist@kubernetescrd
      websecure:
        proxyProtocol:
          trustedIPs:
            - 100.0.0.0/8
            - 10.0.0.0/8
            - 192.168.1.0/24
        http:
          middlewares:
            - traefik-ip-allowlist@kubernetescrd
    logs:
      general:
        level: DEBUG
      access:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
