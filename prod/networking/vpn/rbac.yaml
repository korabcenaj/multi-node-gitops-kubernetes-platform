---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: vpn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale
  namespace: vpn
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
    # Tailscale needs to read the authkey Secret and manage its own
    # state Secret (TS_KUBE_SECRET) so state survives pod restarts
    # without re-authentication.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale
  namespace: vpn
subjects:
  - kind: ServiceAccount
    name: tailscale
    namespace: vpn
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: tailscale
