# Flux Kustomization — homelab cluster
# Watches infra-repo/clusters/homelab/prod/
# Starts with helm-repositories only (Phase 0)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-infra
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-repo
