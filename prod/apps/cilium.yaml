# Cilium CNI — Flux HelmRelease (migrated from Terraform)
# CRITICAL: Must be migrated LAST. All other HelmReleases must be healthy first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  interval: 1h
  timeout: 15m
  values:
    kubeProxyReplacement: true
    # TUNNEL MODE: VXLAN encapsulation avoids nftables/nft_compat conntrack
    # bugs on Ubuntu 24.04. Pod traffic is UDP-encapsulated, bypassing the
    # broken reverse-DNAT path entirely. Survives reboots cleanly.
    routingMode: tunnel
    tunnelProtocol: vxlan
    ipam:
      mode: kubernetes
    k8s:
      requireIPv4PodCIDR: true
    # Per-endpoint routes and auto-direct-node-routes are only for native
    # routing mode — not needed (and ignored) with tunnel encapsulation.
    l7Proxy: false
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      masquerade: true
      # Bypass nftables/iptables-nft conntrack bugs on Ubuntu 24.04
      # by using eBPF-based masquerading instead of iptables
    installNoConntrackIptablesRules: false
    # This option requires direct routing; tunnel mode is the active design.
    hubble:
      enabled: true
      relay:
        # Optional flow aggregation UI is disabled for the low-power profile.
        enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
      ui:
        enabled: false
      metrics:
        enabled:
          - "dns:query;ignoreAAAA"
          - drop
          - tcp
          - flow
          - icmp
          - http
          - port-distribution
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium
        serviceMonitor:
          enabled: false
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
    cluster:
      name: home-lab
      id: 1
    # k3s API endpoint. Cilium agents bypass BPF LB for the API server
    # when k8sServiceHost is explicitly set.
    k8sServiceHost: 192.168.1.199
    k8sServicePort: "6443"
    nodeinit:
      enabled: true
      bootstrapFile: /tmp/cilium-bootstrap-time
      removeCbrBridge: true
      removeFlannelCniConfig: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    tls:
      secretsBackend: k8s
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        applySysctlOverwrites:
          - SYS_ADMIN
          - SYS_CHROOT
          - SYS_PTRACE
          - DAC_OVERRIDE
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    tolerations:
      - operator: Exists
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # VXLAN adds 50 bytes overhead — use 1450 to avoid fragmentation
    mtu: 1450
    cgroup:
      hostRoot: /sys/fs/cgroup
      autoMount:
        enabled: false
    encryption:
      enabled: false
    egressGateway:
      enabled: false
    hostFirewall:
      enabled: false
    socketLB:
      hostNamespaceOnly: true
    wellKnownIdentities:
      enabled: true
    serviceAccounts:
      cilium:
        name: cilium
      operator:
        name: cilium-operator
