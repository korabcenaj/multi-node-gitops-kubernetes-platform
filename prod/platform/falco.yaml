# Falco — Flux HelmRelease (migrated from Terraform)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  releaseName: falco
  chart:
    spec:
      chart: falco
      version: 8.0.2
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  interval: 1h
  timeout: 10m
  values:
    tty: true
    falco:
      jsonOutput: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    falcoctl:
      artifact:
        follow:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        install:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
    containerSecurityContext:
      runAsNonRoot: false
