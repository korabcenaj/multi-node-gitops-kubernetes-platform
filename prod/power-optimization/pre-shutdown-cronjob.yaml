# Pre-Shutdown Validation CronJob
# Runs nightly to verify cluster health before worker shutdown window.
# Scheduled at 22:00 UTC (adjust for local timezone).
# Validates: Longhorn volumes, Flux reconciliation, node readiness.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pre-shutdown-validator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pre-shutdown-validator
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "replicas", "engines"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pre-shutdown-validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pre-shutdown-validator
subjects:
  - kind: ServiceAccount
    name: pre-shutdown-validator
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pre-shutdown-validation
  namespace: kube-system
spec:
  schedule: "0 22 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: pre-shutdown-validator
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: power.homelab/always-on
                        operator: In
                        values:
                          - "true"
          tolerations:
            - key: power.homelab/critical-only
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: validator
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "=== Pre-Shutdown Validation $(date -u) ==="

                  echo ""
                  echo "--- Node Status ---"
                  kubectl get nodes -o wide

                  echo ""
                  echo "--- Always-On Node Readiness ---"
                  kubectl get nodes -l power.homelab/always-on=true

                  echo ""
                  echo "--- Longhorn Volume Health ---"
                  kubectl -n longhorn-system get volumes.longhorn.io -o wide
                  DEGRADED=$(kubectl -n longhorn-system get volumes.longhorn.io -o json | \
                    jq -r '[.items[] | select(.status.robustness != "healthy")] | length')
                  if [ "$DEGRADED" -gt 0 ]; then
                    echo "WARNING: ${DEGRADED} Longhorn volume(s) not healthy"
                    kubectl -n longhorn-system get volumes.longhorn.io -o json | \
                      jq -r '.items[] | select(.status.robustness != "healthy") | "  \(.metadata.name): \(.status.robustness)"'
                  else
                    echo "All Longhorn volumes healthy"
                  fi

                  echo ""
                  echo "--- Longhorn Replica Locations ---"
                  kubectl -n longhorn-system get replicas.longhorn.io -o wide 2>/dev/null || \
                    echo "No replicas found (may use different CRD name)"

                  echo ""
                  echo "--- Flux Kustomization Status ---"
                  kubectl -n flux-system get kustomizations -o wide

                  echo ""
                  echo "--- Flux HelmRelease Status ---"
                  kubectl get helmreleases -A -o wide

                  echo ""
                  echo "--- Pods NOT Running/Succeeded ---"
                  PENDING=$(kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded --no-headers 2>/dev/null | wc -l)
                  if [ "$PENDING" -gt 0 ]; then
                    echo "WARNING: ${PENDING} pods not in Running/Succeeded state"
                    kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded
                  else
                    echo "All pods Running or Succeeded"
                  fi

                  echo ""
                  echo "--- Cilium Agent Status ---"
                  kubectl -n kube-system get pods -l k8s-app=cilium -o wide

                  echo ""
                  echo "=== Validation Complete ==="
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
